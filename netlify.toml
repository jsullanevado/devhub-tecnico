# Despliegue en Netlify (se conecta al repositorio de GitHub y publica en cada push).

[build]
  command = "npm run build"
  publish = "dist/devhub-tecnico/browser"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta (/scripts, /auth/login, ...) la resuelve el router de Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad básicas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos con hash en el nombre no cambian nunca: caché larga.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
