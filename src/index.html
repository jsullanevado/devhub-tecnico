<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DevHub Técnico</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plataforma de conocimiento técnico para equipos de desarrollo."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo claro/oscuro).
         Misma clave y lógica que ThemeService. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('devhub.theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
