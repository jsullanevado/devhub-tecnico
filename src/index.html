<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DevHub Técnico</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Base de conocimiento técnico del equipo: scripts, lecciones aprendidas, notas y manuales en un solo lugar."
    />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Teams, Slack, LinkedIn...).
         og:image y og:url deben ser absolutas: si cambia el dominio, actualizarlas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevHub Técnico" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:title" content="DevHub Técnico" />
    <meta
      property="og:description"
      content="Base de conocimiento técnico del equipo: scripts, lecciones aprendidas, notas y manuales en un solo lugar."
    />
    <meta property="og:url" content="https://devhub-tecnico.netlify.app/" />
    <meta property="og:image" content="https://devhub-tecnico.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo de DevHub Técnico" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Aplica el tema guardado antes de pintar (evita el parpadeo claro/oscuro).
         Misma clave y lógica que ThemeService. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('devhub.theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
